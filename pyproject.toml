[project]
name = "sam3-auto-label"
version = "1.0.0"
description = "Auto-labeling platform: web-auto annotation UI, sam3-api / sapiens-api / locate-anything-api / ops-api inference services, deployment tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Platform code proprietary; vendored sam3 governed by the SAM License (see external/sam3/LICENSE)" }
authors = [
    {name = "shenmi175"}
]

# This pyproject only carries platform tooling configuration (pytest / formatters / mypy)
# and the dev dependency group. It is NOT a Python distribution: the sam3 package is
# vendored in external/sam3 (git submodule) and installed separately, and each service
# (web-auto, sam3-api, sapiens-api, locate-anything-api, ops-api) ships its own
# requirements.txt consumed by its Dockerfile.

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black==24.2.0",
    "ufmt==2.8.0",
    "ruff-api==0.1.0",
    "usort==1.0.2",
]

[project.urls]
"Homepage" = "https://github.com/shenmi175/sam3"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.usort]
first_party_detection = false

[tool.ufmt]
formatter = "ruff-api"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "timm.*",
    "numpy.*",
    "PIL.*",
    "tqdm.*",
    "ftfy.*",
    "regex.*",
    "iopath.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
