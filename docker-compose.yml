name: sam3-auto-label

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  sam3-api:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/sam3-api.Dockerfile
      args:
        SAM3_API_BASE_IMAGE: ${SAM3_API_BASE_IMAGE:-pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime}
    image: sam3-api:local
    profiles:
      - sam3
    restart: unless-stopped
    shm_size: ${SAM3_API_SHM_SIZE:-8gb}
    environment:
      SAM3_API_HOST: 0.0.0.0
      SAM3_API_PORT: 8001
      SAM3_API_DEVICE: ${SAM3_API_DEVICE:-cuda}
      SAM3_API_CHECKPOINT: /models/sam3.pt
      SAM3_API_LOAD_FROM_HF: ${SAM3_API_LOAD_FROM_HF:-0}
      # 启动即加载模型（fail-fast）；置 0 回退懒加载。旧名 SAM3_API_WARMUP_ON_START 仍兼容。
      SAM3_API_EAGER_LOAD: ${SAM3_API_EAGER_LOAD:-1}
      SAM3_API_MAX_BATCH_FILES: ${SAM3_API_MAX_BATCH_FILES:-32}
      SAM3_API_MAX_IMAGE_MB: ${SAM3_API_MAX_IMAGE_MB:-50}
      SAM3_API_MAX_VIDEO_MB: ${SAM3_API_MAX_VIDEO_MB:-4096}
      SAM3_API_VIDEO_UPLOAD_DIR: /app/sam3-api/data/uploads
      SAM3_API_CORS_ORIGINS: ${SAM3_API_CORS_ORIGINS:-*}
      SAM3_API_TOKEN: ${SAM3_API_TOKEN:?Set SAM3_API_TOKEN in .env}
      SAM3_API_ENABLE_INSTANCE_INTERACTIVITY: ${SAM3_API_ENABLE_INSTANCE_INTERACTIVITY:-1}
      SAM3_API_FEATURE_GPU_LRU_SIZE: ${SAM3_API_FEATURE_GPU_LRU_SIZE:-5}
      SAM3_API_FEATURE_WRITE_WORKERS: ${SAM3_API_FEATURE_WRITE_WORKERS:-2}
      SAM3_API_FEATURE_WRITE_MAX_PENDING: ${SAM3_API_FEATURE_WRITE_MAX_PENDING:-32}
      SAM3_API_FEATURE_FORMAT_VERSION: ${SAM3_API_FEATURE_FORMAT_VERSION:-sam3-inst-v1}
      SAM3_API_FEATURE_ALLOWED_ROOTS: ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
    expose:
      - "8001"
    volumes:
      - ${SAM3_CHECKPOINT_DIR:-./sam3_checkpoints}:/models:ro
      - ${SAM3_API_DATA_DIR:-./sam3-api/data}:/app/sam3-api/data
      - ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:rw
      - sam3_hf_cache:/cache/huggingface
      - sam3_torch_cache:/cache/torch
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)); sys.exit(0 if d.get('status') in ('ok','not_loaded','loading') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sapiens-api:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/sapiens-api.Dockerfile
      args:
        SAPIENS_API_BASE_IMAGE: ${SAPIENS_API_BASE_IMAGE:-pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime}
    image: sapiens-api:local
    profiles:
      - sapiens
    restart: unless-stopped
    shm_size: ${SAPIENS_API_SHM_SIZE:-8gb}
    environment:
      SAPIENS_API_HOST: 0.0.0.0
      SAPIENS_API_PORT: 8010
      SAPIENS_DEVICE: ${SAPIENS_DEVICE:-cuda:0}
      SAPIENS_MODEL_NAME: ${SAPIENS_MODEL_NAME:-sapiens2_5b}
      SAPIENS_REPO_DIR: /app/external/sapiens2
      SAPIENS_CHECKPOINT_ROOT: /models/sapiens2
      # 启动即加载模型（fail-fast）；置 0 回退懒加载；权重缺失默认降级存活，SAPIENS_STRICT_EAGER_LOAD=1 时退出。
      SAPIENS_EAGER_LOAD: ${SAPIENS_EAGER_LOAD:-1}
      SAPIENS_ALLOWED_DATA_ROOTS: ${WEB_AUTO_ALLOWED_DATA_ROOTS:-}
      SAPIENS_API_TOKEN: ${SAPIENS_API_TOKEN:?Set SAPIENS_API_TOKEN in .env}
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
    expose:
      - "8010"
    volumes:
      - ${SAPIENS_CHECKPOINT_ROOT:-./sapiens_checkpoints}:/models/sapiens2:rw
      - ${SAPIENS_API_DATA_DIR:-./sapiens-api/data}:/app/sapiens-api/data
      - ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:rw
      - sapiens_hf_cache:/cache/huggingface
      - sapiens_torch_cache:/cache/torch
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)); sys.exit(0 if d.get('status') in ('ok','not_loaded','loading') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  locate-anything-api:
    logging: *default-logging
    build:
      context: .
      dockerfile: locate-anything-api/Dockerfile
    image: locate-anything-api:local
    profiles:
      - locate
    restart: unless-stopped
    environment:
      LOCATE_API_HOST: 0.0.0.0
      LOCATE_API_PORT: 8004
      LOCATE_CHECKPOINT_PATH: /models/LocateAnything-3B
      LOCATE_API_TOKEN: ${LOCATE_API_TOKEN:-}
      LOCATE_ATTN_BACKEND: ${LOCATE_ATTN_BACKEND:-la_flash}
      # 启动即加载模型（fail-fast）；置 0 回退懒加载。旧名 LOCATE_WARMUP_ON_START 仍兼容。
      LOCATE_EAGER_LOAD: ${LOCATE_EAGER_LOAD:-1}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
    expose:
      - "8004"
    volumes:
      - ${LOCATE_CHECKPOINT_DIR:-./locate_checkpoints}:/models:rw
      - locate_hf_cache:/cache/huggingface
      - locate_torch_cache:/cache/torch
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=5)); sys.exit(0 if d.get('status') in ('ok','not_loaded','loading') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  ops-api:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/ops-api.Dockerfile
    image: ops-api:local
    restart: unless-stopped
    environment:
      OPS_API_HOST: 0.0.0.0
      OPS_API_PORT: 8020
      OPS_API_TOKEN: ${OPS_API_TOKEN:?Set OPS_API_TOKEN in .env}
      OPS_ALLOWED_SERVICES: ${OPS_ALLOWED_SERVICES:-sam3-api,locate-anything-api,sapiens-api}
      OPS_CONTROLLABLE_SERVICES: ${OPS_CONTROLLABLE_SERVICES:-sam3-api,locate-anything-api,sapiens-api}
      OPS_LOGGABLE_SERVICES: ${OPS_LOGGABLE_SERVICES:-ops-api,web-auto,task-worker,sam3-api,locate-anything-api,sapiens-api}
      OPS_SHARED_LOG_DIR: /logs/web-auto
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-sam3-auto-label}
      OPS_PROJECT_ROOT: /workspace
      OPS_HOST_PROJECT_ROOT: ${OPS_HOST_PROJECT_ROOT:-.}
      SAPIENS_ENABLED: ${SAPIENS_ENABLED:-0}
      SAPIENS_API_TOKEN: ${SAPIENS_API_TOKEN:?Set SAPIENS_API_TOKEN in .env}
      SAPIENS_API_BASE_IMAGE: ${SAPIENS_API_BASE_IMAGE:-pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime}
      SAPIENS_API_DATA_DIR: ${SAPIENS_API_DATA_DIR:-./sapiens-api/data}
      SAPIENS_API_SHM_SIZE: ${SAPIENS_API_SHM_SIZE:-8gb}
      SAPIENS_CHECKPOINT_ROOT: ${SAPIENS_CHECKPOINT_ROOT:-./sapiens_checkpoints}
      SAPIENS_DEVICE: ${SAPIENS_DEVICE:-cpu}
      SAPIENS_EAGER_LOAD: ${SAPIENS_EAGER_LOAD:-0}
      SAPIENS_GPU_DEVICE_ID: ${SAPIENS_GPU_DEVICE_ID:-0}
      SAPIENS_MODEL_NAME: ${SAPIENS_MODEL_NAME:-sapiens2_5b}
      WEB_AUTO_HOST_DATA_ROOT: ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}
      WEB_AUTO_ALLOWED_DATA_ROOTS: ${WEB_AUTO_ALLOWED_DATA_ROOTS:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_HUB_TOKEN:-}
    expose:
      - "8020"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPS_HOST_PROJECT_ROOT:-.}:/workspace:rw
      - ${WEB_AUTO_DATA_DIR:-./web-auto/data}/logs:/logs/web-auto:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web-auto:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/web-auto.Dockerfile
    image: web-auto:local
    restart: unless-stopped
    user: "${WEB_AUTO_UID:-1000}:${WEB_AUTO_GID:-1000}"
    depends_on:
      ops-api:
        condition: service_healthy
    environment:
      WEB_AUTO_HOST: 0.0.0.0
      WEB_AUTO_PORT: 8000
      WEB_AUTO_DATA_DIR: /data/web-auto
      WEB_AUTO_HOST_DATA_ROOT: ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}
      WEB_AUTO_ALLOWED_DATA_ROOTS: ${WEB_AUTO_ALLOWED_DATA_ROOTS:-}
      WEB_AUTO_DEFAULT_UPLOAD_TARGET_DIR: ${WEB_AUTO_DEFAULT_UPLOAD_TARGET_DIR:-/opt/sam3/project-data/uploads}
      WEB_AUTO_ALLOW_ORIGINS: ${WEB_AUTO_ALLOW_ORIGINS:-*}
      WEB_AUTO_DEFAULT_SAM3_API_BASE_URL: http://sam3-api:8001
      WEB_AUTO_ALLOWED_SAM3_API_BASE_URLS: http://sam3-api:8001
      WEB_AUTO_SAM3_API_TOKEN: ${SAM3_API_TOKEN:?Set SAM3_API_TOKEN in .env}
      WEB_AUTO_DEFAULT_SAPIENS_API_BASE_URL: http://sapiens-api:8010
      WEB_AUTO_SAPIENS_API_TOKEN: ${SAPIENS_API_TOKEN:?Set SAPIENS_API_TOKEN in .env}
      WEB_AUTO_DEFAULT_LOCATE_API_BASE_URL: http://locate-anything-api:8004
      WEB_AUTO_ALLOWED_LOCATE_API_BASE_URLS: http://locate-anything-api:8004
      WEB_AUTO_LOCATE_API_TOKEN: ${LOCATE_API_TOKEN:-}
      WEB_AUTO_OPS_API_BASE_URL: http://ops-api:8020
      WEB_AUTO_OPS_API_TOKEN: ${OPS_API_TOKEN:?Set OPS_API_TOKEN in .env}
      WEB_AUTO_AUTH_ENABLED: ${WEB_AUTO_AUTH_ENABLED:-0}
      WEB_AUTO_SESSION_TTL_SECONDS: ${WEB_AUTO_SESSION_TTL_SECONDS:-43200}
      WEB_AUTO_ADMIN_USERNAME: ${WEB_AUTO_ADMIN_USERNAME:-admin}
      WEB_AUTO_ADMIN_PASSWORD: ${WEB_AUTO_ADMIN_PASSWORD:?Set WEB_AUTO_ADMIN_PASSWORD in .env}
      WEB_AUTO_SAM3_MAX_BATCH_FILES: ${WEB_AUTO_SAM3_MAX_BATCH_FILES:-32}
      WEB_AUTO_SMART_FILTER_RETENTION_MAX_RUNS: ${WEB_AUTO_SMART_FILTER_RETENTION_MAX_RUNS:-10}
      WEB_AUTO_SMART_FILTER_RETENTION_DAYS: ${WEB_AUTO_SMART_FILTER_RETENTION_DAYS:-30}
      WEB_AUTO_LOG_MAX_BYTES: ${WEB_AUTO_LOG_MAX_BYTES:-5242880}
      WEB_AUTO_LOG_FILE_COUNT: ${WEB_AUTO_LOG_FILE_COUNT:-3}
      WEB_AUTO_EVENT_LOG_MAX_BYTES: ${WEB_AUTO_EVENT_LOG_MAX_BYTES:-5242880}
      WEB_AUTO_EVENT_LOG_FILE_COUNT: ${WEB_AUTO_EVENT_LOG_FILE_COUNT:-3}
      WEB_AUTO_SERVICE_NAME: web-auto
      WEB_AUTO_MODEL_WARMUP_IMAGE: /app/example/model_warmup.jpg
      WEB_AUTO_GPU_DEPLOYMENT: ${WEB_AUTO_GPU_DEPLOYMENT:-0}
      WEB_AUTO_SAM3_GPU_DEVICE_ID: ${SAM3_GPU_DEVICE_ID:-0}
      WEB_AUTO_SAPIENS_GPU_DEVICE_ID: ${SAPIENS_GPU_DEVICE_ID:-0}
      WEB_AUTO_LOCATE_GPU_DEVICE_ID: ${LOCATE_GPU_DEVICE_ID:-2}
    expose:
      - "8000"
    ports:
      - "${WEB_AUTO_HTTP_BIND:-0.0.0.0}:${WEB_AUTO_HTTP_PORT:-8000}:8000"
    volumes:
      - ./web-auto:/app/web-auto
      - ./example:/app/example:ro
      - ${WEB_AUTO_DATA_DIR:-./web-auto/data}:/data/web-auto
      - ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  task-worker:
    logging: *default-logging
    image: web-auto:local
    restart: unless-stopped
    user: "${WEB_AUTO_UID:-1000}:${WEB_AUTO_GID:-1000}"
    command: ["python", "-m", "app.worker"]
    environment:
      WEB_AUTO_DATA_DIR: /data/web-auto
      WEB_AUTO_HOST_DATA_ROOT: ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}
      WEB_AUTO_ALLOWED_DATA_ROOTS: ${WEB_AUTO_ALLOWED_DATA_ROOTS:-}
      WEB_AUTO_DEFAULT_UPLOAD_TARGET_DIR: ${WEB_AUTO_DEFAULT_UPLOAD_TARGET_DIR:-/opt/sam3/project-data/uploads}
      WEB_AUTO_DEFAULT_SAM3_API_BASE_URL: http://sam3-api:8001
      WEB_AUTO_ALLOWED_SAM3_API_BASE_URLS: http://sam3-api:8001
      WEB_AUTO_SAM3_API_TOKEN: ${SAM3_API_TOKEN:?Set SAM3_API_TOKEN in .env}
      WEB_AUTO_DEFAULT_SAPIENS_API_BASE_URL: http://sapiens-api:8010
      WEB_AUTO_SAPIENS_API_TOKEN: ${SAPIENS_API_TOKEN:?Set SAPIENS_API_TOKEN in .env}
      WEB_AUTO_DEFAULT_LOCATE_API_BASE_URL: http://locate-anything-api:8004
      WEB_AUTO_ALLOWED_LOCATE_API_BASE_URLS: http://locate-anything-api:8004
      WEB_AUTO_LOCATE_API_TOKEN: ${LOCATE_API_TOKEN:-}
      WEB_AUTO_OPS_API_BASE_URL: http://ops-api:8020
      WEB_AUTO_OPS_API_TOKEN: ${OPS_API_TOKEN:?Set OPS_API_TOKEN in .env}
      WEB_AUTO_WORKER_RESOURCE: all
      WEB_AUTO_WORKER_BATCH_SLICE: ${WEB_AUTO_WORKER_BATCH_SLICE:-4}
      WEB_AUTO_SAM3_MAX_BATCH_FILES: ${WEB_AUTO_SAM3_MAX_BATCH_FILES:-32}
      WEB_AUTO_SMART_FILTER_RETENTION_MAX_RUNS: ${WEB_AUTO_SMART_FILTER_RETENTION_MAX_RUNS:-10}
      WEB_AUTO_SMART_FILTER_RETENTION_DAYS: ${WEB_AUTO_SMART_FILTER_RETENTION_DAYS:-30}
      WEB_AUTO_LOG_MAX_BYTES: ${WEB_AUTO_LOG_MAX_BYTES:-5242880}
      WEB_AUTO_LOG_FILE_COUNT: ${WEB_AUTO_LOG_FILE_COUNT:-3}
      WEB_AUTO_EVENT_LOG_MAX_BYTES: ${WEB_AUTO_EVENT_LOG_MAX_BYTES:-5242880}
      WEB_AUTO_EVENT_LOG_FILE_COUNT: ${WEB_AUTO_EVENT_LOG_FILE_COUNT:-3}
      WEB_AUTO_SERVICE_NAME: task-worker
      WEB_AUTO_AUTH_ENABLED: ${WEB_AUTO_AUTH_ENABLED:-0}
      WEB_AUTO_SESSION_TTL_SECONDS: ${WEB_AUTO_SESSION_TTL_SECONDS:-43200}
    volumes:
      - ./web-auto:/app/web-auto
      - ${WEB_AUTO_DATA_DIR:-./web-auto/data}:/data/web-auto
      - ${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:${WEB_AUTO_HOST_DATA_ROOT:-/opt/sam3/project-data}:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib; assert b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  sam3_hf_cache:
  sam3_torch_cache:
  sapiens_hf_cache:
  sapiens_torch_cache:
  locate_hf_cache:
  locate_torch_cache:
