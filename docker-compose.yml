name: sam3-auto-label

services:
  sam3-api:
    build:
      context: .
      dockerfile: docker/sam3-api.Dockerfile
      args:
        SAM3_API_BASE_IMAGE: ${SAM3_API_BASE_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime}
    image: sam3-api:local
    restart: unless-stopped
    shm_size: ${SAM3_API_SHM_SIZE:-8gb}
    environment:
      SAM3_API_HOST: 0.0.0.0
      SAM3_API_PORT: 8001
      SAM3_API_DEVICE: ${SAM3_API_DEVICE:-cuda}
      SAM3_API_CHECKPOINT: /models/sam3.pt
      SAM3_API_LOAD_FROM_HF: ${SAM3_API_LOAD_FROM_HF:-0}
      SAM3_API_WARMUP_ON_START: ${SAM3_API_WARMUP_ON_START:-0}
      SAM3_API_MAX_BATCH_FILES: ${SAM3_API_MAX_BATCH_FILES:-32}
      SAM3_API_MAX_IMAGE_MB: ${SAM3_API_MAX_IMAGE_MB:-50}
      SAM3_API_MAX_VIDEO_MB: ${SAM3_API_MAX_VIDEO_MB:-4096}
      SAM3_API_VIDEO_UPLOAD_DIR: /app/sam3-api/data/uploads
      SAM3_API_CORS_ORIGINS: ${SAM3_API_CORS_ORIGINS:-*}
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
    ports:
      - "${SAM3_API_PORT:-8001}:8001"
    volumes:
      - ${SAM3_CHECKPOINT_DIR:-./sam3_checkpoints}:/models:ro
      - ${SAM3_API_DATA_DIR:-./sam3-api/data}:/app/sam3-api/data
      - sam3_hf_cache:/cache/huggingface
      - sam3_torch_cache:/cache/torch
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web-auto:
    build:
      context: .
      dockerfile: docker/web-auto.Dockerfile
    image: web-auto:local
    restart: unless-stopped
    depends_on:
      sam3-api:
        condition: service_healthy
    environment:
      WEB_AUTO_HOST: 0.0.0.0
      WEB_AUTO_PORT: 8000
      WEB_AUTO_DATA_DIR: /data/web-auto
      WEB_AUTO_ALLOW_ORIGINS: ${WEB_AUTO_ALLOW_ORIGINS:-*}
      WEB_AUTO_DEFAULT_SAM3_API_BASE_URL: http://sam3-api:8001
      WEB_AUTO_SAM3_MAX_BATCH_FILES: ${WEB_AUTO_SAM3_MAX_BATCH_FILES:-32}
    ports:
      - "${WEB_AUTO_PORT:-8000}:8000"
    volumes:
      - ${WEB_AUTO_DATA_DIR:-./web-auto/data}:/data/web-auto
      - ${WEB_AUTO_HOST_DATA_ROOT:-/home/zmb}:${WEB_AUTO_HOST_DATA_ROOT:-/home/zmb}:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  sam3_hf_cache:
  sam3_torch_cache:
