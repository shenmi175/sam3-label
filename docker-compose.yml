name: sam3-auto-label

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:${NPM_IMAGE_TAG:-2.14.0}
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_BIND:-0.0.0.0}:${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_BIND:-0.0.0.0}:${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_BIND:-127.0.0.1}:${NPM_ADMIN_PORT:-81}:81"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DISABLE_IPV6: ${NPM_DISABLE_IPV6:-true}
      INITIAL_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL:?Set NPM_ADMIN_EMAIL in .env to a real email address}
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD:?Set NPM_ADMIN_PASSWORD in .env}
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

  sam3-api:
    build:
      context: .
      dockerfile: docker/sam3-api.Dockerfile
      args:
        SAM3_API_BASE_IMAGE: ${SAM3_API_BASE_IMAGE:-pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime}
    image: sam3-api:local
    restart: unless-stopped
    shm_size: ${SAM3_API_SHM_SIZE:-8gb}
    environment:
      SAM3_API_HOST: 0.0.0.0
      SAM3_API_PORT: 8001
      SAM3_API_DEVICE: ${SAM3_API_DEVICE:-cuda}
      SAM3_API_CHECKPOINT: /models/sam3.pt
      SAM3_API_LOAD_FROM_HF: ${SAM3_API_LOAD_FROM_HF:-0}
      SAM3_API_WARMUP_ON_START: ${SAM3_API_WARMUP_ON_START:-0}
      SAM3_API_MAX_BATCH_FILES: ${SAM3_API_MAX_BATCH_FILES:-32}
      SAM3_API_MAX_IMAGE_MB: ${SAM3_API_MAX_IMAGE_MB:-50}
      SAM3_API_MAX_VIDEO_MB: ${SAM3_API_MAX_VIDEO_MB:-4096}
      SAM3_API_VIDEO_UPLOAD_DIR: /app/sam3-api/data/uploads
      SAM3_API_CORS_ORIGINS: ${SAM3_API_CORS_ORIGINS:-*}
      SAM3_API_TOKEN: ${SAM3_API_TOKEN:?Set SAM3_API_TOKEN in .env}
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
    expose:
      - "8001"
    volumes:
      - ${SAM3_CHECKPOINT_DIR:-./sam3_checkpoints}:/models:ro
      - ${SAM3_API_DATA_DIR:-./sam3-api/data}:/app/sam3-api/data
      - sam3_hf_cache:/cache/huggingface
      - sam3_torch_cache:/cache/torch
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web-auto:
    build:
      context: .
      dockerfile: docker/web-auto.Dockerfile
    image: web-auto:local
    restart: unless-stopped
    depends_on:
      sam3-api:
        condition: service_healthy
    environment:
      WEB_AUTO_HOST: 0.0.0.0
      WEB_AUTO_PORT: 8000
      WEB_AUTO_DATA_DIR: /data/web-auto
      WEB_AUTO_ALLOW_ORIGINS: ${WEB_AUTO_ALLOW_ORIGINS:-*}
      WEB_AUTO_DEFAULT_SAM3_API_BASE_URL: http://sam3-api:8001
      WEB_AUTO_ALLOWED_SAM3_API_BASE_URLS: http://sam3-api:8001
      WEB_AUTO_SAM3_API_TOKEN: ${SAM3_API_TOKEN:?Set SAM3_API_TOKEN in .env}
      WEB_AUTO_AUTH_ENABLED: ${WEB_AUTO_AUTH_ENABLED:-1}
      WEB_AUTO_SESSION_TTL_SECONDS: ${WEB_AUTO_SESSION_TTL_SECONDS:-43200}
      WEB_AUTO_ADMIN_USERNAME: ${WEB_AUTO_ADMIN_USERNAME:-admin}
      WEB_AUTO_ADMIN_PASSWORD: ${WEB_AUTO_ADMIN_PASSWORD:?Set WEB_AUTO_ADMIN_PASSWORD in .env}
      NPM_INTERNAL_URL: http://nginx-proxy-manager:81
      NPM_ADMIN_EMAIL: ${NPM_ADMIN_EMAIL:?Set NPM_ADMIN_EMAIL in .env to a real email address}
      NPM_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD:?Set NPM_ADMIN_PASSWORD in .env}
      WEB_AUTO_SAM3_MAX_BATCH_FILES: ${WEB_AUTO_SAM3_MAX_BATCH_FILES:-32}
    expose:
      - "8000"
    ports:
      - "${WEB_AUTO_BOOTSTRAP_BIND:-0.0.0.0}:${WEB_AUTO_BOOTSTRAP_PORT:-8000}:8000"
    volumes:
      - ${WEB_AUTO_DATA_DIR:-./web-auto/data}:/data/web-auto
      - ${WEB_AUTO_HOST_DATA_ROOT:-/home/zmb}:${WEB_AUTO_HOST_DATA_ROOT:-/home/zmb}:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  npm_data:
  npm_letsencrypt:
  sam3_hf_cache:
  sam3_torch_cache:
