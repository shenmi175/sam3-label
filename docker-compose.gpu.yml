# GPU 分配覆盖层。SAM3 与 Sapiens 默认共享物理 GPU 0，LocateAnything 默认使用 GPU 2。
# 同卡的 SAM3 与 Sapiens 默认关闭 eager load，通过 web-auto 的“加载模型”按钮执行真实推理预热；
# 切换到另一个同卡模型前必须停止当前模型服务，以释放显存。
services:
  sam3-api:
    gpus:
      - driver: nvidia
        device_ids: ["${SAM3_GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]
    environment:
      SAM3_API_DEVICE: cuda:0
      SAM3_API_EAGER_LOAD: ${SAM3_API_EAGER_LOAD:-0}

  sapiens-api:
    gpus:
      - driver: nvidia
        device_ids: ["${SAPIENS_GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]
    environment:
      SAPIENS_DEVICE: cuda:0
      SAPIENS_EAGER_LOAD: ${SAPIENS_EAGER_LOAD:-0}

  locate-anything-api:
    gpus:
      - driver: nvidia
        device_ids: ["${LOCATE_GPU_DEVICE_ID:-2}"]
        capabilities: [gpu]
    environment:
      LOCATE_DEVICE: cuda:0

  web-auto:
    environment:
      WEB_AUTO_GPU_DEPLOYMENT: "1"
      WEB_AUTO_SAM3_GPU_DEVICE_ID: ${SAM3_GPU_DEVICE_ID:-0}
      WEB_AUTO_SAPIENS_GPU_DEVICE_ID: ${SAPIENS_GPU_DEVICE_ID:-0}
      WEB_AUTO_LOCATE_GPU_DEVICE_ID: ${LOCATE_GPU_DEVICE_ID:-2}
