services:
  sam3-api:
    gpus:
      - driver: nvidia
        device_ids: ["${SAM3_GPU_DEVICE_ID:-1}"]
        capabilities: [gpu]
    environment:
      SAM3_API_DEVICE: cuda:0

  sapiens-api:
    gpus:
      - driver: nvidia
        device_ids: ["${SAPIENS_GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]
    environment:
      SAPIENS_DEVICE: cuda:0

  locate-anything-api:
    gpus:
      - driver: nvidia
        device_ids: ["${LOCATE_GPU_DEVICE_ID:-2}"]
        capabilities: [gpu]
    environment:
      LOCATE_DEVICE: cuda:0
