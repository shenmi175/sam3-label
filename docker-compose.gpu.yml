# GPU 分配覆盖层。默认三服务分卡（sam3=1、sapiens=0、locate=2），启动即加载（*_EAGER_LOAD 默认 1）互不冲突。
# 注意：若把多个 *_GPU_DEVICE_ID 配成同一张卡，多个模型会同时 eager 加载导致显存不足（CUDA OOM），
# 失败的服务会 fail-fast 退出并 crash-loop。同卡部署时必须保留至少一个服务 *_EAGER_LOAD=0，
# 用 /v1/warmup + /v1/unload 手动轮换加载。
services:
  sam3-api:
    gpus:
      - driver: nvidia
        device_ids: ["${SAM3_GPU_DEVICE_ID:-1}"]
        capabilities: [gpu]
    environment:
      SAM3_API_DEVICE: cuda:0

  sapiens-api:
    gpus:
      - driver: nvidia
        device_ids: ["${SAPIENS_GPU_DEVICE_ID:-0}"]
        capabilities: [gpu]
    environment:
      SAPIENS_DEVICE: cuda:0

  locate-anything-api:
    gpus:
      - driver: nvidia
        device_ids: ["${LOCATE_GPU_DEVICE_ID:-2}"]
        capabilities: [gpu]
    environment:
      LOCATE_DEVICE: cuda:0
